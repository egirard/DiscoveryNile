# Verify every push and pull request; deploy `main` to GitHub Pages once it is verified (see
# docs/ci-and-deployment.md). The template's retained PR previews stay disabled for now.
name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate Linux screenshot baselines and push them to this branch
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx playwright install --with-deps chromium
      - if: inputs.update_baselines != true
        run: nix develop --command bun run verify:change
      - if: inputs.update_baselines == true
        run: |
          nix develop --command bun run test:e2e:update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e
          git commit -m "Regenerate Linux screenshot baselines" || echo "no baseline changes"
          git push
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/

  # The hosted table: the verified build of `main`, served from GitHub Pages at /<repo>/ through
  # the Pages deployment action (Settings → Pages → source: GitHub Actions). The local backend only;
  # no relay is hosted, so phones cannot take a seat from the hosted table yet.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run build
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          VITE_GIT_HASH: ${{ github.sha }}
          VITE_DEFAULT_BACKEND: local
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
