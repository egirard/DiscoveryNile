<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#1c2a2e" />
    <!-- One bundled font for every screen, so text rasterises the same on every table and on CI
         (system-ui resolves to different fonts on different machines, which broke screenshot baselines). -->
    <style>
      @font-face {
        font-family: 'Nile Sans';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('%sveltekit.assets%/fonts/DejaVuSans.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nile Sans';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('%sveltekit.assets%/fonts/DejaVuSans-Bold.woff2') format('woff2');
      }
      html { font-family: 'Nile Sans', 'DejaVu Sans', sans-serif; }
      button, input, select, textarea { font-family: inherit; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
